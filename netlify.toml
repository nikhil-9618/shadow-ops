[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public Convex deployment URL (baked into the client bundle; not a secret)
  VITE_CONVEX_URL = "https://majestic-swordfish-875.convex.cloud"

# SPA fallback: serve index.html for all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
